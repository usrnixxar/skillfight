name: Install uploaded SkillFight backgrounds
on:
  push:
    paths:
      - '.github/workflows/install-uploaded-backgrounds.yml'
permissions:
  contents: write
jobs:
  copy-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded video and arena background to Vite public assets
        run: |
          mkdir -p public/assets/video public/assets/backgrounds
          test -s "animated video.mp4"
          test -s "level background.png"
          cp "animated video.mp4" public/assets/video/menu-loop.mp4
          cp "level background.png" public/assets/backgrounds/level-surface.png
          file public/assets/video/menu-loop.mp4 public/assets/backgrounds/level-surface.png
      - name: Commit installed media and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/video/menu-loop.mp4 public/assets/backgrounds/level-surface.png
          git rm -- .github/workflows/install-uploaded-backgrounds.yml
          git commit -m "Install uploaded loop video and arena background"
          git push
