name: Install character animation frames
on:
  push:
    paths:
      - '.github/workflows/install-animation-frames.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded frame folders into public assets
        run: |
          mkdir -p public/assets/characters/male2 public/assets/characters/female2
          cp "male 2/"*.png public/assets/characters/male2/
          cp "female 2/"*.png public/assets/characters/female2/
          test "$(find public/assets/characters/male2 -name '*.png' | wc -l)" -eq 10
          test "$(find public/assets/characters/female2 -name '*.png' | wc -l)" -eq 10
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/male2 public/assets/characters/female2
          git rm -- .github/workflows/install-animation-frames.yml
          git commit -m "Install 20 uploaded gun animation frames for game"
          git push
