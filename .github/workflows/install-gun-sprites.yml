name: Install SkillFight gun sprites
on:
  push:
    paths:
      - '.github/workflows/install-gun-sprites.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract four character PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('public/assets/characters/SkillFight_Gun_PNG_Install (1).zip')
          dest = Path('public/assets/characters')
          with ZipFile(archive) as z:
              for name in ('p1_gun_idle.png','p1_gun_aim.png','p2_gun_idle.png','p2_gun_aim.png'):
                  data = z.read('public/assets/characters/' + name)
                  if not data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]):
                      raise ValueError(name + ' is not a PNG')
                  (dest / name).write_bytes(data)
          print('Installed all four gun sprites')
          PY
      - name: Commit extracted assets and remove temporary installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/p1_gun_idle.png public/assets/characters/p1_gun_aim.png public/assets/characters/p2_gun_idle.png public/assets/characters/p2_gun_aim.png
          git rm -- ".github/workflows/install-gun-sprites.yml"
          git commit -m "Install extracted gun PNG characters from uploaded archive"
          git push
